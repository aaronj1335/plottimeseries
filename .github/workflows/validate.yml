name: validate

# Everything that says whether a change is good: `npm run validate`, plus the
# standalone builds and their smoke tests. Publishing lives in publish.yml, so
# this badge means "the code is sound", not "the release went out".

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# No token scopes by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    # Actions are pinned to commit SHAs, not tags: a tag can be moved to point
    # at new code, and these run with access to the workspace. Dependabot
    # updates the SHAs and records the version in the trailing comment.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # This job never pushes, so don't leave a credential in .git/config
        # where any build step could pick it up.
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # Install scripts are arbitrary code from every package in the tree, run
    # before anything has been audited. Nothing here needs them.
    - run: npm ci --ignore-scripts --verbose

    # Audits, then lints, typechecks, tests and builds the site with no network
    # egress. See scripts/validate.ts. Produces pages-public/.
    - run: npm run validate

    # The plain directory, not actions/upload-pages-artifact: publish.yml
    # downloads this and builds the Pages artifact there, in the run that
    # actually deploys.
    - name: Upload the built site
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pages-public
        path: pages-public
        retention-days: 1
        if-no-files-found: error

  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: linux-x64
          suffix: ''
        - os: macos-latest
          target: macos-arm64
          suffix: ''
        - os: windows-latest
          target: windows-x64
          suffix: '.exe'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      EXE: plottimeseries${{ matrix.suffix }}
      COMPILED: plottimeseries-compiled${{ matrix.suffix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js 24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x
        cache: 'npm'
    - run: npm ci --ignore-scripts
    - run: npm run build:standalone
    - name: Smoke test the standalone build
      shell: bash
      run: |
        node dist/plottimeseries.cjs public/data.csv > /dev/null
        "./dist/$EXE" public/data.csv > /dev/null
        cat public/data.csv | "./dist/$EXE" > /dev/null
        if [ -f "dist/$COMPILED" ]; then
          "./dist/$COMPILED" public/data.csv > /dev/null
          cat public/data.csv | "./dist/$COMPILED" --y-max 100 > /dev/null
        else
          echo "::warning::scriptc produced no compiled binary on ${{ matrix.target }}"
        fi
    - name: Package the standalone build
      shell: bash
      run: |
        mkdir -p release
        files="$EXE plottimeseries.cjs"
        if [ -f "dist/$COMPILED" ]; then
          files="$files $COMPILED"
        fi
        tar -czf "release/plottimeseries-${{ matrix.target }}.tar.gz" -C dist $files
    # The artifact actions stay on v4 rather than jumping to the current major
    # with the rest: this release flow is new, and `merge-multiple` over in
    # publish.yml is the kind of input that moves between majors. Dependabot
    # will propose the bump with its changelog attached, which is a better
    # place to weigh it.
    - name: Upload the standalone executable
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: plottimeseries-${{ matrix.target }}
        path: release/plottimeseries-${{ matrix.target }}.tar.gz
    - name: Upload the single file script
      if: matrix.target == 'linux-x64'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: plottimeseries-script
        path: dist/plottimeseries.cjs
